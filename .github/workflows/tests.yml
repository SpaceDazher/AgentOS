name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          # Research evidence binds historical commits by full SHA.  A
          # shallow checkout makes valid provenance look unresolvable.
          fetch-depth: 0

      - name: Materialize portable research dependency refs
        shell: bash
        run: |
          # Historical dependency gates require the origin ref and, when a
          # local ref exists, require it to match.  PR checkout fetches only
          # the PR/main refs, so reproduce the evidence-ref namespace without
          # checking out or executing content from those branches.
          git fetch --no-tags origin \
            '+refs/heads/codex/*:refs/remotes/origin/codex/*' \
            '+refs/heads/codex/*:refs/heads/codex/*'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify research integrity (SHA-256 pin)
        shell: bash
        run: |
          # Hash the immutable Git blob, not the checkout bytes: Windows may
          # materialize CRLF while the research pin is defined over Git LF.
          git show HEAD:research/agentos_confident_result/agentos_evidence_review.md \
            | sha256sum \
            | grep -qi '^3b1df2d6efe8cedc128d1ccde6f07ae189902e9638548dc09f4263dfe7db0f1c '

      - name: Run test suite (no LLM/network required)
        env:
          AGENTOS_HOME: ${{ runner.temp }}/agentos-home
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Demo smoke (happy + flaky)
        shell: bash
        run: |
          python -m agentos.cli demo --db "$RUNNER_TEMP/demo-happy"
          python -m agentos.cli demo --flaky --db "$RUNNER_TEMP/demo-flaky"

      - name: Plugin import check (bootstrap + registration shape)
        shell: bash
        run: |
          python - <<'EOF'
          import sys, types, importlib.util
          from pathlib import Path

          plugin_dir = Path("hermes_plugin").resolve()
          ns = "hermes_plugins"
          if ns not in sys.modules:
              pkg = types.ModuleType(ns)
              pkg.__path__ = []
              sys.modules[ns] = pkg
          mod_name = f"{ns}.agentos_harness"
          spec = importlib.util.spec_from_file_location(
              mod_name, plugin_dir / "__init__.py",
              submodule_search_locations=[str(plugin_dir)])
          module = importlib.util.module_from_spec(spec)
          sys.modules[mod_name] = module
          spec.loader.exec_module(module)

          assert hasattr(module, "register"), "register(ctx) missing"
          assert len(module._TOOLS) == 4, f"expected 4 tools, got {len(module._TOOLS)}"
          for name, schema, handler, _emoji in module._TOOLS:
              out = handler({})
              assert isinstance(out, str), f"{name}: handler must return JSON string"
          print("plugin import + handler smoke OK:", [t[0] for t in module._TOOLS])
          EOF
